<!doctype html>
<html lang="zh-Hans">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="format-detection" content="telephone=no">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#F2F4F8">
<title>安心护 · 测试版</title>
<style>
:root{
  --primary:#0F1C3F; --accent:#1C5BFF; --accent-soft:#E9EFFF;
  --bg:#F2F4F8; --surface:#FFFFFF; --ink:#0F172A; --ink-2:#465166; --line:#E4E8EF;
  --shadow:0 1px 2px rgba(15,28,63,.05),0 10px 28px rgba(15,28,63,.07);
  --home-bg:linear-gradient(180deg,#E6EDFC 0%,#F2F4F8 420px);
  --low:#E2A008; --low-ink:#6E4A00; --low-soft:#FFF6DC;
  --mid:#E8661C; --mid-ink:#8F3407; --mid-soft:#FFEEE3;
  --high:#D42A1E; --high-2:#A8170F; --high-soft:#FDE9E7;
  --ok:#0E8A5E; --ok-soft:#E3F4EC;
  --dot:#0B1630; --off:#CBD1DB; --off-dot:#AEB6C3; --tabbar:rgba(255,255,255,.95); --tab-ink:#6B7585;
  --outer:#DDE2EA; --ring-glow:.35;
}
@media (prefers-color-scheme: dark){
  :root{
    --primary:#2A63FF; --accent:#4F8BFF; --accent-soft:rgba(79,139,255,.16);
    --bg:#060C1F; --surface:#0F1830; --ink:#EEF2FA; --ink-2:#A9B4C8; --line:#1F2A44;
    --shadow:0 1px 0 rgba(255,255,255,.03) inset,0 10px 30px rgba(0,0,0,.35);
    --home-bg:radial-gradient(120% 420px at 50% 0%,rgba(18,220,246,.16) 0%,rgba(20,80,255,.10) 40%,rgba(6,12,31,0) 75%),#060C1F;
    --low-ink:#FFD36B; --low-soft:rgba(226,160,8,.16);
    --mid-ink:#FFA36B; --mid-soft:rgba(232,102,28,.18);
    --high-soft:rgba(212,42,30,.20);
    --ok:#3DD598; --ok-soft:rgba(61,213,152,.14);
    --dot:#FFFFFF; --off:#2C3752; --off-dot:#3E4A66; --tabbar:rgba(10,17,36,.95); --tab-ink:#7E8AA3;
    --outer:#02060F; --ring-glow:.7;
  }
}
html{font-size:17px;-webkit-text-size-adjust:100%}
html.sz1{font-size:19px} html.sz2{font-size:21.5px}
*{box-sizing:border-box}
body{margin:0;background:var(--outer);color:var(--ink);font-family:-apple-system,"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans SC",sans-serif;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;border:0;background:none;padding:0;cursor:pointer;text-align:inherit}
input,textarea{font:inherit;color:inherit}
.app{max-width:440px;margin:0 auto;min-height:100vh;min-height:100dvh;background:var(--bg);position:relative}
.app.home{background:var(--home-bg)}
.main{padding:.4rem 1.15rem calc(6.2rem + env(safe-area-inset-bottom))}
svg.i{width:1.4rem;height:1.4rem;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}

/* top bar */
.bar{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:.5rem;min-height:3rem;padding:calc(.3rem + env(safe-area-inset-top)) .8rem .3rem;background:var(--bg);background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
.app.home .bar{background:transparent;backdrop-filter:none;-webkit-backdrop-filter:none}
.bar .back{display:flex;align-items:center;gap:.15rem;color:var(--accent);font-size:1rem;font-weight:600;min-height:2.6rem;padding-right:.6rem}
.bar .ttl{flex:1;text-align:center;font-weight:700;font-size:1rem;margin-right:3.4rem}
.brand{display:flex;align-items:center;gap:.5rem;font-weight:800;font-size:1.15rem;padding-left:.3rem}
.brand svg{width:1.75rem;height:1.75rem}

/* type */
.large{font-size:1.9rem;line-height:1.2;font-weight:800;letter-spacing:-.01em;margin:.2rem 0 .3rem}
.sub{font-size:1.06rem;color:var(--ink-2);margin:0 0 1rem}
.h{font-size:1.06rem;font-weight:700;margin:0;line-height:1.35}
.t2{font-size:1.3rem;font-weight:800;margin:0 0 .5rem;line-height:1.3}
.s{font-size:.9rem;line-height:1.5;color:var(--ink-2);margin:0}
.b{font-size:1rem;line-height:1.55;margin:0}
.foot{font-size:.82rem;line-height:1.5;color:var(--ink-2);margin:.9rem .2rem 0}

/* surfaces */
.card{background:var(--surface);border-radius:20px;padding:1rem;margin-top:.85rem;box-shadow:var(--shadow)}
.card.tight{padding:.4rem 1rem}
.cap{font-size:.85rem;font-weight:700;color:var(--ink-2);margin:0 0 .2rem}
.li{display:flex;gap:.8rem;align-items:center;padding:.75rem 0;width:100%}
.li+.li{border-top:1px solid var(--line)}
.li .grow{flex:1;min-width:0}
.ico{width:2.6rem;height:2.6rem;border-radius:12px;display:grid;place-items:center;flex:none;background:var(--accent-soft);color:var(--accent)}
.ico.ok{background:var(--ok-soft);color:var(--ok)} .ico.grey{background:var(--accent-soft);color:var(--ink-2)}
.ico.mid{background:var(--mid);color:#fff} .ico.high{background:var(--high-soft);color:var(--high)}
.chev{color:var(--tab-ink)}
.tick{color:var(--ok)}

/* buttons */
.btn{display:flex;align-items:center;justify-content:center;gap:.55rem;width:100%;min-height:3.4rem;border-radius:16px;font-size:1.12rem;font-weight:700;text-align:center;padding:.4rem 1rem}
.btn+.btn{margin-top:.6rem}
.btn.pri{background:var(--primary);color:#fff;box-shadow:0 6px 16px rgba(15,28,63,.18)}
.btn.danger{background:linear-gradient(180deg,var(--high),var(--high-2));color:#fff;box-shadow:0 8px 20px rgba(212,42,30,.28)}
.btn.mid{background:var(--mid);color:#fff;box-shadow:0 8px 20px rgba(232,102,28,.25)}
.btn.out{background:var(--surface);color:var(--ink);border:1px solid var(--line);box-shadow:var(--shadow)}
.btn.ghost{color:var(--ink-2);min-height:2.8rem;font-size:1rem}
.btn[disabled]{opacity:.45}
.row{display:flex;gap:.6rem;margin-top:.7rem}
.row .btn{margin:0;min-height:3.1rem;font-size:1rem;flex:1}
.mt{margin-top:1rem}

/* halo guard */
.guard{display:flex;flex-direction:column;align-items:center;width:100%;margin-top:.6rem}
.ringwrap{position:relative;width:12.5rem;height:12.5rem;transition:transform .15s}
.guard:active .ringwrap{transform:scale(.97)}
.ringwrap svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.arc{fill:none;stroke-width:36;stroke-linecap:round;transition:stroke .35s}
.glow{fill:none;stroke-width:44;stroke-linecap:round;opacity:0;filter:blur(16px);transition:opacity .45s}
.dotc{position:absolute;left:50%;top:50%;width:2.3rem;height:2.3rem;margin:-1.15rem 0 0 -1.15rem;border-radius:50%;background:var(--dot);transition:background .35s,box-shadow .35s}
.guard.on .arc{stroke:url(#gh)} .guard.on .glow{stroke:url(#gh);opacity:var(--ring-glow)}
.guard:not(.on) .arc{stroke:var(--off)} .guard:not(.on) .dotc{background:var(--off-dot)}
@media (prefers-color-scheme: dark){.guard.on .dotc{box-shadow:0 0 14px 4px rgba(18,220,246,.75),0 0 40px 14px rgba(20,80,255,.35)}}
.gst{font-size:1.65rem;font-weight:800;margin-top:.9rem}
.ghint{font-size:.95rem;color:var(--ink-2);margin-top:.15rem}
.gdesc{text-align:center;font-size:.97rem;line-height:1.5;color:var(--ink-2);margin:.6rem .8rem 0}

/* check */
.ta{display:block;width:100%;min-height:11rem;border:1.5px solid var(--line);border-radius:18px;background:var(--surface);padding:.9rem;font-size:1.12rem;line-height:1.55;resize:vertical;outline:none}
.ta:focus{border-color:var(--accent)}
.ta::placeholder{color:#7B8494}
.meta{display:flex;justify-content:space-between;align-items:center;margin-top:.4rem;font-size:.85rem;color:var(--ink-2)}
.meta button{color:var(--accent);font-weight:600;padding:.3rem 0}
.sample{display:flex;align-items:center;gap:.7rem;width:100%;padding:.8rem .9rem;border-radius:14px;background:var(--surface);border:1px solid var(--line);font-weight:600;font-size:1rem}
.sample+.sample{margin-top:.5rem}
.sample .grow{flex:1}
.hide{display:none!important}
.note{display:flex;gap:.55rem;align-items:flex-start;font-size:.9rem;line-height:1.5;color:var(--ink-2);margin-top:.9rem}
.note svg{width:1.15rem;height:1.15rem;margin-top:.15rem}
.spin{width:1.2rem;height:1.2rem;border-radius:50%;border:2.5px solid rgba(255,255,255,.35);border-top-color:#fff;animation:sp 0.8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}

/* result */
.risk{border-radius:24px;padding:1.15rem;margin-top:1.1rem;box-shadow:var(--shadow);position:relative;overflow:hidden;background:var(--surface)}
.risk .lv{display:flex;align-items:center;gap:.6rem;font-size:.9rem;font-weight:800;letter-spacing:.02em}
.risk .badge{width:2.1rem;height:2.1rem;border-radius:11px;display:grid;place-items:center;color:#fff}
.risk .big{font-size:1.8rem;line-height:1.2;font-weight:800;margin:.8rem 0 .35rem;letter-spacing:-.01em}
.risk .why{font-size:1.02rem;line-height:1.5;font-weight:500;color:var(--ink-2)}
.risk.high{background:linear-gradient(160deg,#E2372A 0%,var(--high-2) 100%);color:#fff;box-shadow:0 14px 32px rgba(168,23,15,.28)}
.risk.high .badge{background:rgba(255,255,255,.18)} .risk.high .why{color:rgba(255,255,255,.93)}
.risk.medium .badge{background:var(--mid)} .risk.medium .lv{color:var(--mid-ink)}
.risk.low .badge{background:var(--low)} .risk.low .lv{color:var(--low-ink)}
.risk.uncertain .badge{background:var(--ink-2)} .risk.uncertain .lv{color:var(--ink-2)}
.risk.medium:before,.risk.low:before{content:"";position:absolute;left:0;right:0;top:0;height:6px}
.risk.medium:before{background:var(--mid)} .risk.low:before{background:var(--low)}
.dev{display:flex;align-items:center;gap:.6rem;margin-top:.9rem;padding:.6rem .75rem;border-radius:12px;font-size:.9rem;font-weight:600}
.risk.high .dev{background:rgba(0,0,0,.16)}
.risk.medium .dev{background:var(--mid-soft);color:var(--mid-ink)}
.risk.low .dev,.risk.uncertain .dev{background:var(--low-soft);color:var(--low-ink)}
.dev.offline{background:rgba(127,127,127,.12)!important;color:inherit!important;opacity:.9}
.led{width:.75rem;height:.75rem;border-radius:50%;flex:none}
.led.high{background:#fff;animation:flash .5s infinite} .led.medium{background:var(--mid);animation:pulse .9s infinite} .led.low{background:var(--low);animation:breathe 2.4s infinite} .led.off{background:var(--off-dot)}
@keyframes breathe{0%,100%{opacity:.35}50%{opacity:1}}
@keyframes pulse{0%,100%{opacity:.25}50%{opacity:1}}
@keyframes flash{0%,49%{opacity:1}50%,100%{opacity:.15}}
.q{border-left:4px solid var(--high);padding:.1rem 0 .1rem .75rem;margin-top:.8rem}
.q.medium{border-color:var(--mid)} .q.low{border-color:var(--low)}
.q .quote{font-size:1rem;font-weight:700;line-height:1.45}
.q .exp{font-size:.95rem;line-height:1.5;color:var(--ink-2);margin-top:.15rem}
.num{display:flex;gap:.7rem;align-items:flex-start;margin-top:.75rem;font-size:1rem;line-height:1.5}
.num b{width:1.65rem;height:1.65rem;border-radius:50%;background:var(--primary);color:#fff;display:grid;place-items:center;font-size:.9rem;flex:none}
.tag{font-size:.75rem;font-weight:800;padding:.15rem .5rem;border-radius:999px;background:var(--mid-soft);color:var(--mid-ink);flex:none}
.tag.n{background:var(--bg);color:var(--ink-2)}
.mono{font-family:ui-monospace,Menlo,monospace;font-weight:700;word-break:break-all}
details summary{font-weight:700;cursor:pointer;list-style:none;display:flex;justify-content:space-between;align-items:center}
details summary::-webkit-details-marker{display:none}
details p{white-space:pre-wrap;color:var(--ink-2);margin:.6rem 0 0;line-height:1.5}

/* pause */
.ring{width:13rem;height:13rem;margin:1.2rem auto .6rem;position:relative}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .n{position:absolute;inset:0;display:grid;place-items:center;text-align:center;font-size:3.6rem;font-weight:800;color:var(--primary)}
.ring .n small{display:block;font-size:.9rem;font-weight:600;color:var(--ink-2);margin-top:-.4rem}
.breath{text-align:center;font-size:1.15rem;font-weight:700;min-height:1.6rem}
.step{display:flex;gap:.8rem;align-items:flex-start;padding:.85rem 0}
.step+.step{border-top:1px solid var(--line)}
.step .n2{width:1.9rem;height:1.9rem;border-radius:50%;display:grid;place-items:center;font-weight:800;background:var(--accent-soft);color:var(--accent);flex:none}
.step.done .n2{background:var(--ok);color:#fff}
.step .mini{margin-top:.5rem;min-height:2.6rem;padding:0 1rem;border-radius:12px;border:1px solid var(--line);font-weight:700;background:var(--surface)}
.step.done .mini{display:none}
.okline{display:flex;gap:.5rem;align-items:center;color:var(--ok);font-weight:700;margin-top:.8rem}

/* quick check */
.prog{height:.45rem;background:var(--line);border-radius:9px;overflow:hidden;margin:.45rem 0 1rem}
.prog i{display:block;height:100%;background:var(--primary);border-radius:9px;transition:width .3s}
.qcard{background:var(--surface);border-radius:22px;padding:1.3rem;box-shadow:var(--shadow);font-size:1.35rem;font-weight:800;line-height:1.4;margin-bottom:1rem}

/* settings */
.seg{display:flex;background:var(--bg);border-radius:12px;padding:3px;margin-top:.5rem}
.seg button{flex:1;padding:.55rem .3rem;border-radius:10px;font-size:.95rem;font-weight:600;color:var(--ink-2);text-align:center;min-height:2.6rem}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.sw{display:flex;align-items:center;gap:.8rem;padding:.7rem 0}
.toggle{width:3.1rem;height:1.9rem;border-radius:2rem;background:var(--off);position:relative;flex:none;transition:background .2s}
.toggle:after{content:"";position:absolute;top:.12rem;left:.12rem;width:1.66rem;height:1.66rem;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:left .2s}
.toggle.on{background:var(--primary)} .toggle.on:after{left:1.32rem}
.field{width:100%;min-height:3rem;border:1.5px solid var(--line);border-radius:12px;background:var(--bg);padding:.5rem .8rem;font-size:1.05rem;margin-top:.5rem;outline:none}
.log{font-family:ui-monospace,Menlo,monospace;font-size:.78rem;line-height:1.6;white-space:pre-wrap;background:var(--bg);border-radius:12px;padding:.8rem;max-height:60vh;overflow:auto;user-select:text;-webkit-user-select:text}

/* tab bar */
.tabs{position:fixed;bottom:0;left:0;right:0;max-width:440px;margin:0 auto;z-index:6;display:flex;padding:.4rem .3rem calc(.4rem + env(safe-area-inset-bottom));background:var(--tabbar);border-top:1px solid var(--line);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
.tabs button{flex:1;display:flex;flex-direction:column;align-items:center;gap:.15rem;font-size:.72rem;font-weight:700;color:var(--tab-ink);padding:.2rem 0;text-align:center}
.tabs button.on{color:var(--primary)}
@media (prefers-color-scheme: dark){.tabs button.on{color:#7FA6FF}}

/* sheet + toast */
.scrim{position:fixed;inset:0;background:rgba(5,10,25,.45);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{width:100%;max-width:440px;background:var(--surface);border-radius:24px 24px 0 0;padding:1.2rem 1.15rem calc(1.2rem + env(safe-area-inset-bottom));animation:up .25s ease-out;max-height:90vh;overflow:auto}
@keyframes up{from{transform:translateY(30%);opacity:.4}}
.grab{width:2.6rem;height:.3rem;border-radius:3px;background:var(--line);margin:0 auto 1rem}
.bubble{background:var(--accent-soft);border-radius:14px;padding:.85rem;font-size:.95rem;line-height:1.55;white-space:pre-wrap;margin:.6rem 0 1rem}
.who{display:flex;gap:.6rem;flex-wrap:wrap;margin:.4rem 0 1rem}
.who button{display:flex;flex-direction:column;align-items:center;gap:.35rem;width:4.4rem;font-size:.9rem;font-weight:600;text-align:center}
.who .av{width:3.2rem;height:3.2rem;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:800;font-size:1.15rem}
.wave{display:flex;gap:.3rem;justify-content:center;align-items:center;height:4rem;margin:1rem 0}
.wave i{width:.4rem;border-radius:.3rem;background:var(--accent);animation:wv 1s ease-in-out infinite}
.wave i:nth-child(2){animation-delay:.15s}.wave i:nth-child(3){animation-delay:.3s}.wave i:nth-child(4){animation-delay:.45s}.wave i:nth-child(5){animation-delay:.6s}
@keyframes wv{0%,100%{height:.8rem}50%{height:3.4rem}}
#toast{position:fixed;left:50%;bottom:calc(6rem + env(safe-area-inset-bottom));transform:translateX(-50%);background:rgba(15,23,42,.92);color:#fff;padding:.7rem 1.1rem;border-radius:14px;font-size:.95rem;font-weight:600;z-index:30;opacity:0;pointer-events:none;transition:opacity .2s;max-width:86vw;text-align:center}
#toast.show{opacity:1}

/* ?frame=1 – rounded phone frame inside the portfolio iframe; the screen scrolls inside the frame */
html.frame,html.frame body{height:100%;overflow:hidden;background:transparent}
html.frame #root{position:absolute;inset:0}
/* iPhone-style device: black bezel, Dynamic Island, status bar, home indicator.
   clip-path (not only overflow) keeps blurred / shadowed children from bleeding past the round corners. */
.device{position:absolute;inset:0;border-radius:62px;background:#0B0B0D;padding:12px;box-shadow:inset 0 0 0 2px #2B2B30,inset 0 0 0 5px #0B0B0D,inset 0 0 0 6px #1C1C20}
.screen{position:relative;height:100%;border-radius:50px;overflow:hidden;clip-path:inset(0 round 50px);isolation:isolate;background:var(--bg);display:flex;flex-direction:column}
.screen.home{background:var(--home-bg)}
.island{position:absolute;top:11px;left:50%;transform:translateX(-50%);width:122px;height:35px;border-radius:20px;background:#000;z-index:9;pointer-events:none}
.sb{flex:none;height:52px;display:flex;align-items:center;justify-content:space-between;padding:6px 30px 0 40px;font:600 16px/1 -apple-system,"SF Pro Text","PingFang SC","Microsoft YaHei",sans-serif;color:var(--ink);letter-spacing:-.01em;position:relative;z-index:8}
.sb .r{display:flex;gap:6px;align-items:center}
.sb svg{fill:currentColor;display:block}
.homebar{position:absolute;bottom:8px;left:50%;transform:translateX(-50%);width:136px;height:5px;border-radius:3px;background:var(--ink);opacity:.85;z-index:9;pointer-events:none}
html.frame .app{flex:1;min-height:0;max-width:none;display:flex;flex-direction:column;background:transparent}
html.frame .bar{position:static;flex:none;padding-top:0;background:transparent;backdrop-filter:none;-webkit-backdrop-filter:none}
html.frame .main{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none;padding-bottom:1.2rem}
html.frame .main::-webkit-scrollbar{display:none}
html.frame .tabs{position:static;flex:none;width:100%;max-width:none;margin:0;padding:.45rem .3rem 1.7rem;background:var(--surface);backdrop-filter:none;-webkit-backdrop-filter:none}
html.frame .scrim{inset:12px;border-radius:50px;overflow:hidden}
html.frame .sheet{padding-bottom:2rem}
html.frame #toast{bottom:6.4rem}

/* welcome */
.welcome{padding:calc(1.6rem + env(safe-area-inset-top)) 1.3rem 2rem;max-width:440px;margin:0 auto}
.welcome .logo{width:5.5rem;height:5.5rem;margin:1rem auto .6rem;display:block}
.welcome h1{text-align:center;font-size:1.7rem;margin:.2rem 0 .5rem}
.welcome .lead{text-align:center;color:var(--ink-2);font-size:1.02rem;line-height:1.6;margin:0 0 1rem}
.welcome .li{align-items:flex-start;font-size:1rem;line-height:1.5}
.welcome .li svg{color:var(--ok);margin-top:.1rem}
.pids{display:grid;grid-template-columns:repeat(3,1fr);gap:.5rem;margin:.5rem 0 1.2rem}
.pids button{text-align:center;min-height:3rem;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);font-weight:700}
.pids button.on{border-color:var(--primary);background:var(--primary);color:#fff}
.langlink{display:block;margin:1rem auto 0;color:var(--accent);font-weight:600;text-align:center}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
 <linearGradient id="gh" x1="0" x2="1" y1="0" y2="0"><stop offset="0" stop-color="#1450FF"/><stop offset=".55" stop-color="#1A8BFF"/><stop offset="1" stop-color="#12DCF6"/></linearGradient>
</defs></svg>
<div id="root"></div>
<div id="sheet"></div>
<div id="toast" role="status" aria-live="polite"></div>

<script>
(function(){
"use strict";

/* ---------------- storage & state ---------------- */
/* ?demo=1  portfolio demo: skips the welcome page, no test log, separate storage, no browser history
   ?frame=1 draws the app inside a rounded phone-shaped frame (for the portfolio iframe) */
var params = new URLSearchParams(location.search);
var DEMO = params.get("demo") === "1", FRAME = params.get("frame") === "1";

function analyze(text){

    if(!q) return;
    used[q] = 1;
    hits.push({ lv:r.lv, quote:q, reason:T(r.zh, r.en) });
  });
  hits.sort(function(a, b){ return b.lv - a.lv; });
  var contacts = scanContacts(text);
  var max = hits.length ? hits[0].lv : 0, n2 = hits.filter(function(h){ return h.lv >= 2; }).length;
  var risk;
  if(max >= 3 || n2 >= 4) risk = "high";
  else if(max === 2 || contacts.some(function(c){ return c.sus; })) risk = "medium";
  else if(text.replace(/\s/g, "").length < 8) risk = "uncertain";
  else risk = "low";
  var top = hits[0] ? hits[0].reason : "";
  if(S.lang === "en" && top) top = top.charAt(0).toLowerCase() + top.slice(1);
  var summary = {
    high: T("这条内容有典型的诈骗特征：" + top + "。", "This has classic scam signs: " + top + "."),
    medium: T("有可疑的地方：" + (top || "消息里的链接或号码不可信") + "。先核实，再行动。", "Something is off: " + (top || "the link or number looks untrustworthy") + ". Verify before you act."),
    low: T("暂未发现明显的诈骗特征，但不能保证安全。", "No clear scam signs, but safety can't be guaranteed."),
    uncertain: T("内容太少，暂时无法判断。可以多粘贴一些上下文。", "Too little to judge. Try pasting more of the conversation.")
  }[risk];
  return {
    id: "r" + Date.now(), time: Date.now(), input: text, risk: risk, summary: summary, quick: false,
    evidence: risk === "low" || risk === "uncertain" ? hits.slice(0, 1) : hits.slice(0, 3),
    actions: ACTIONS[risk].map(function(a){ return T(a[0], a[1]); }),
    contacts: contacts
  };
}

    : risk === "medium" ? (top ? T("有可疑的地方：" + top + "。先核实，再行动。", "Something is off: " + top + ". Verify before you act.") : T("有的问题您不确定。没弄清楚之前，先不要转账、不要给验证码。", "You weren't sure about some questions. Until it's clear, don't pay or share codes."))
    : T("您的回答里没有常见的诈骗信号，但仍要小心。", "No common scam signs in your answers, but stay careful.");
  var acts = risk === "high"
    ? [T("现在就挂断电话，不要转账，不要说验证码。","Hang up now. Don't transfer money or read out any code."), T("打 96110 反诈专线，或者给家人打个电话说说刚才的情况。","Call someone you trust, or your bank on the number on your card."), T("如果已经转了钱，马上打 110，并联系银行。","If you already paid, call the police and your bank right away.")]
    : risk === "medium"
    ? [T("先挂断，自己查官方电话再打回去核实。","Hang up and call the organisation back on its official number."), T("不要按对方说的下载 App 或打开屏幕共享。","Don't install apps or share your screen because they asked."), T("和家人商量后再做决定。","Talk to family before deciding.")]
    : ACTIONS.low.map(function(a){ return T(a[0], a[1]); });
  var lbl = { yes:T("是","Yes"), no:T("不是","No"), unsure:T("不确定","Not sure") };
  return { id:"r" + Date.now(), time:Date.now(), quick:true, answers:ans, risk:risk, summary:summary, evidence:[], actions:acts, contacts:[],
    input: QUESTIONS.map(function(q, i){ return T(q.zh, q.en) + " — " + lbl[ans[i]]; }).join("\n") };
}

/* ---------------- alerts (phone + Wizard-of-Oz reminder) ---------------- */
function alertFor(rec){
  var r = RISK[rec.risk];
  if(S.phoneAlert && r.vib && navigator.vibrate){ try{ navigator.vibrate(r.vib); }catch(e){} }
  if(S.guard && rec.risk !== "uncertain"){ S.lit = rec.risk; LS.set("lit", S.lit); log(T("提醒器应亮灯（主持人触发）","Reminder should light (moderator)"), RISK[rec.risk].zh); }
}
/* Records keep only the raw input (or answers). All wording is rebuilt in the current
   language every time a record is shown, so the interface never mixes languages. */
function full(stored){
  if(stored.quick && !stored.answers) return stored;
  var v = stored.quick ? quickResult(stored.answers) : analyze(stored.input);
  v.id = stored.id; v.time = stored.time;
  return v;
}
function addRecord(rec){
  S.records.unshift({ id:rec.id, time:rec.time, quick:rec.quick, input:rec.quick ? "" : rec.input, answers:rec.answers }); S.records = S.records.slice(0, 30); S.latestId = rec.id;
  LS.set("records", S.records);
  log(rec.quick ? T("快速自查结果","Self-check result") : T("检查结果","Check result"), RISK[rec.risk].zh);
  alertFor(rec);
}
function findRec(id){ for(var i = 0; i < S.records.length; i++) if(S.records[i].id === id) return full(S.records[i]); return null; }

/* ---------------- speech ---------------- */
var speakingId = null;
function speak(rec){
  if(!("speechSynthesis" in window)){ toast(T("这个浏览器不能朗读（正式 App 可以）","This browser can't read aloud (the real app can)")); return; }
  if(speakingId === rec.id){ speechSynthesis.cancel(); speakingId = null; render(); return; }
  speechSynthesis.cancel();
  var r = RISK[rec.risk];
  var text = [T(r.zh, r.en) + T("。", "."), T(r.head[0], r.head[1]), rec.summary]
    .concat(rec.evidence.length ? [T("为什么可疑：","Why it's suspicious:")].concat(rec.evidence.map(function(e){ return e.reason; })) : [])
    .concat([T("接下来可以怎么做：","What you can do next:")]).concat(rec.actions.map(function(a, i){ return (i + 1) + ". " + a; })).join("\n");
  var u = new SpeechSynthesisUtterance(text);
  u.lang = S.lang === "en" ? "en-US" : "zh-CN"; u.rate = 0.9;
  u.onend = u.onerror = function(){ speakingId = null; render(); };
  speakingId = rec.id; speechSynthesis.speak(u); log(T("点了读给我听","Read aloud")); render();
}

function vPause(){
  var p = S.pause || { left: FAST ? 10 : 60, total: FAST ? 10 : 60, state: "idle" };

  var h = '<div class="large">' + T("先停一下","Pause for a moment") + '</div><p class="sub">' + T("这一分钟里，什么都不用做。骗子最怕您停下来。","For one minute, do nothing. Scammers hate it when you stop.") + "</p>" +
    '<div class="ring"><svg viewBox="0 0 200 200"><circle cx="100" cy="100" r="92" fill="none" stroke="var(--line)" stroke-width="14"/><circle id="arc" cx="100" cy="100" r="92" fill="none" stroke="url(#gh)" stroke-width="14" stroke-linecap="round" stroke-dasharray="' + C.toFixed(1) + '" stroke-dashoffset="' + (C * (1 - frac)).toFixed(1) + '"/></svg><div class="n"><div><span id="sec">' + p.left + "</span><small>" + T("秒","sec") + "</small></div></div></div>" +
    '<div class="breath" id="breath">' + (p.state === "run" ? T("吸气……","Breathe in…") : "") + "</div>";

    h += '<div class="card"><p class="t2">' + T("做得好，您停下来了。","Well done – you paused.") + '</p><p class="b">' + T("现在想一想：对方是不是在催您？是不是让您保密？如果是，就不要继续了。","Now think: were they rushing you? Asking you to keep it secret? If so, don't go on.") + "</p></div>" +

      '<button class="btn out mt" data-act="share" data-v="' + (S.latestId || "") + '">' + I("users") + T("问问信任的人","Ask someone you trust") + "</button>";
  }
  return { bar:bar(T("安全暂停","Safety pause"), true), body:h };
}
var pauseTimer = null;
function startPause(){
  clearInterval(pauseTimer);
  S.pause.state = "run"; log(T("开始暂停","Pause started")); render();
  var tick = 0;
  pauseTimer = setInterval(function(){
    var p = S.pause; if(!p || p.state !== "run"){ clearInterval(pauseTimer); return; }
    p.left -= 1; tick++;
    var sec = document.getElementById("sec"), arc = document.getElementById("arc"), br = document.getElementById("breath");
    var C = 2 * Math.PI * 92;
    if(sec) sec.textContent = p.left;
    if(arc) arc.setAttribute("stroke-dashoffset", (C * (1 - p.left / p.total)).toFixed(1));
    if(br) br.textContent = (tick % 10) < 4 ? T("吸气……","Breathe in…") : T("慢慢呼气……","Breathe out slowly…");
    if(p.left <= 0){ clearInterval(pauseTimer); p.state = "done"; log(T("暂停完成","Pause finished")); if(navigator.vibrate && S.phoneAlert) try{ navigator.vibrate(200); }catch(e){} render(); }
  }, 1000);
}

    '<button class="btn pri" data-act="qa" data-v="yes">' + T("是","Yes") + '</button><button class="btn out" data-act="qa" data-v="no">' + T("不是","No") + '</button><button class="btn ghost" data-act="qa" data-v="unsure">' + T("不确定","Not sure") + "</button>" +
    (S.quick.length ? '<button class="btn ghost" data-act="qback">' + I("back") + T("上一题","Previous question") + "</button>" : "");
  return { bar:bar(T("通话快速自查","Call self-check"), true), body:h };
}
function vQuickResult(top){
  var rec = findRec(top.v);
  if(!rec) return vQuick();
  return { bar:bar(T("自查结果","Self-check result"), true), body: resultCard(rec, rec.id === S.latestId) + '<button class="btn out mt" data-act="qagain">' + I("redo") + T("重新回答","Answer again") + "</button>" };
}
function vRecord(top){
  var rec = findRec(top.v);
  return { bar:bar(T("检查记录","Check record"), true), body: rec ? resultCard(rec, rec.id === S.latestId) : "" };
}

function vHistory(){
  var h = '<div class="large">' + T("记录","History") + "</div>";
  if(!S.records.length) h += '<p class="sub">' + T("还没有检查记录。","No checks yet.") + "</p>";
  else h += '<div class="card tight">' + S.records.map(function(r0){
    var r = full(r0);
    var d = new Date(r.time), tm = String(d.getHours()).padStart(2, "0") + ":" + String(d.getMinutes()).padStart(2, "0");
    return row(RISK[r.risk].icon, r.risk === "high" ? "high" : r.risk === "medium" ? "mid" : "", T(RISK[r.risk].zh, RISK[r.risk].en) + (r.quick ? T(" · 快速自查"," · self-check") : ""), tm + " · " + esc(r.input.slice(0, 24)) + "…", I("chev", "chev"), "openrec", ' data-v="' + r.id + '"');
  }).join("") + "</div>";
  h += '<p class="foot">' + T("测试版的记录只保存在这台手机的浏览器里。","In this test version, history stays in this phone's browser only.") + "</p>";
  return { bar:bar(), body:h };
}

function vSettings(){
  var sz = [T("标准","Standard"), T("大","Large"), T("特大","Extra large")];
  var h = '<div class="large">' + T("设置","Settings") + "</div>" +
    '<div class="card"><p class="h">' + T("文字大小","Text size") + '</p><div class="seg">' + sz.map(function(l, i){ return '<button data-act="size" data-v="' + i + '" class="' + (S.size === i ? "on" : "") + '">' + l + "</button>"; }).join("") + '</div><p class="b" style="font-weight:800;margin-top:.8rem">' + T("先停下，不要转账或给验证码。","Stop. Don't send money or codes.") + "</p></div>" +
    '<div class="card"><p class="h">' + T("语言","Language") + '</p><div class="seg"><button data-act="lang" data-v="zh" class="' + (S.lang === "zh" ? "on" : "") + '">中文</button><button data-act="lang" data-v="en" class="' + (S.lang === "en" ? "on" : "") + '">English</button></div></div>' +
    '<div class="card"><div class="sw"><div class="grow"><div class="h">' + T("手机提醒","Phone alert") + '</div></div><button class="toggle ' + (S.phoneAlert ? "on" : "") + '" data-act="phonealert" role="switch" aria-checked="' + S.phoneAlert + '" aria-label="' + T("手机提醒","Phone alert") + '"></button></div><p class="s">' + T("手机负责提醒您一次：查出风险时振动。一直提醒、直到您停下来的，是桌上的提醒器。","The phone alerts you once by vibrating. The reminder on your table keeps alerting until you stop.") + "</p></div>" +
    '<div class="card"><p class="h">' + T("信任的人","Someone you trust") + '</p><input id="trusted" class="field" type="tel" inputmode="tel" placeholder="' + T("家人的手机号（可不填）","Their mobile number (optional)") + '" value="' + esc(S.trusted) + '"><p class="s" style="margin-top:.4rem">' + T("填了以后，“发短信给家人”会自动填好这个号码。测试时可以随便填一个。","Pre-fills “Text a family member”. Any number is fine for the test.") + "</p></div>" +
    (DEMO
      ? '<div class="card tight">' + row("redo", "grey", T("重新开始演示","Restart the demo"), T("清除这次演示的记录","Clears this demo's history"), I("chev", "chev"), "reset") + "</div>" +
        '<p class="foot">' + T("安心护 WiseHalo · 作品集演示版。分析用固定规则判断、不调用 AI，提醒器为模拟状态；内容不会上传。","WiseHalo · portfolio demo. Analysis uses fixed rules instead of AI and the reminder is simulated; nothing is uploaded.") + "</p>"
      : '<div class="card tight">' + row("list", "", T("测试记录","Test log"), T("给研究者看的操作记录","Steps recorded for the researcher"), I("chev", "chev"), "push", ' data-v="log"') + row("redo", "grey", T("重新开始测试","Restart the test"), T("清除这台手机上的测试数据","Clears test data on this phone"), I("chev", "chev"), "reset") + "</div>" +
        '<p class="foot">' + T("安心护 WiseHalo · 测试原型。所有内容都是虚构的，不会上传。","WiseHalo · test prototype. Everything is fictional and nothing is uploaded.") + (S.pid ? " · " + esc(S.pid) : "") + "</p>");
  return { bar:bar(), body:h };
}
function vLog(){
  var lines = ["WiseHalo test log · " + (S.pid || "-") + " · " + (S.t0 ? new Date(S.t0).toLocaleString() : "")].concat(S.log.map(function(l){ return mmss(l.t) + "  " + l.e + (l.d ? " · " + l.d : ""); }));
  return { bar:bar(T("测试记录","Test log"), true), body:'<p class="sub" style="margin-top:.4rem">' + T("测试结束后，请截图这一页，或点“复制”发给研究者。","After the test, screenshot this page or tap Copy and send it to the researcher.") + '</p><div class="log" id="logtxt">' + esc(lines.join("\n")) + '</div><button class="btn pri mt" data-act="copylog">' + T("复制记录","Copy log") + "</button>" };
}

function vWelcome(){
  var pids = ["P1","P2","P3","P4","P5",T("演示","Demo")];
  return '<div class="welcome"><svg class="logo" viewBox="0 0 48 48" aria-hidden="true"><path d="M14.5 36.5A15 15 0 1 1 33.5 36.5" fill="none" stroke="url(#gh)" stroke-width="6" stroke-linecap="round"/><circle cx="24" cy="24" r="4.2" fill="var(--dot)"/></svg>' +
    "<h1>" + T("安心护 · 测试版","WiseHalo · test version") + '</h1><p class="lead">' + T("谢谢您帮忙试用！这是一个还在设计中的手机工具，帮大家识别可疑的电话和信息。","Thank you for helping! This is a phone tool, still being designed, that helps people spot suspicious calls and messages.") + "</p>" +
    '<div class="card tight">' + [T("我们测的是工具好不好用，不是在考您","We're testing the tool, not you"), T("里面的消息都是编出来的","All messages here are made up"), T("请不要输入真实的姓名、账号、密码或验证码","Please don't enter real names, accounts, passwords or codes"), T("内容只留在您的手机上，不会上传","Everything stays on your phone – nothing is uploaded")].map(function(t){ return '<div class="li">' + I("checkc") + "<span>" + t + "</span></div>"; }).join("") + "</div>" +
    '<p class="h mt">' + T("您的编号（主持人会告诉您）","Your code (the researcher will tell you)") + '</p><div class="pids">' + pids.map(function(p){ return '<button data-act="pid" data-v="' + p + '" class="' + (S.pid === p ? "on" : "") + '">' + p + "</button>"; }).join("") + "</div>" +
    '<button class="btn pri" data-act="start"' + (S.pid ? "" : " disabled") + ">" + T("开始","Start") + "</button>" +
    '<button class="langlink" data-act="lang" data-v="' + (S.lang === "zh" ? "en" : "zh") + '">' + (S.lang === "zh" ? "English" : "中文") + "</button></div>";
}

/* ---------------- sheets ---------------- */
function shareText(rec){
  if(!rec) return "";
  var r = RISK[rec.risk];
  return T("安心护检查结果：\n" + r.zh + " — " + r.head[0] + "\n\n" + rec.summary + "\n\n我先不操作，你能帮我一起看看吗？",
           "WiseHalo check result:\n" + r.en + " — " + r.head[1] + "\n\n" + rec.summary + "\n\nI haven't done anything yet. Can you help me check this first?");
}
function renderSheet(){
  var el = document.getElementById("sheet"), s = S.sheet;
  if(!s){ el.innerHTML = ""; return; }
  var h = "";
  if(s.type === "share"){
    var people = [[T("女儿","Daughter"),"#E8661C"],[T("儿子","Son"),"#1C5BFF"],[T("老伴","Partner"),"#0E8A5E"],[T("朋友","Friend"),"#7A4FD9"]];
    h = '<p class="t2">' + T("把结果发给谁？","Who should see this?") + '</p><div class="who">' + people.map(function(p){ return '<button data-act="sendto" data-v="' + p[0] + '"><span class="av" style="background:' + p[1] + '">' + p[0].charAt(0) + "</span>" + p[0] + "</button>"; }).join("") + "</div>" +
      '<p class="s">' + T("会发送这段话：","This will be sent:") + '</p><div class="bubble">' + esc(shareText(findRec(s.v))) + '</div><button class="btn ghost" data-act="sheetclose">' + T("取消","Cancel") + "</button>";
  } else if(s.type === "sms"){
    h = '<p class="t2">' + T("新短信","New message") + '</p><p class="s">' + T("收件人","To") + '</p><input id="smsto" class="field" type="tel" placeholder="' + T("输入手机号或选择联系人","Number or contact") + '" value="' + esc(S.trusted) + '"><div class="bubble">' + esc(shareText(findRec(s.v))) + '</div><button class="btn pri" data-act="smssend">' + I("msg") + T("发送","Send") + '</button><button class="btn ghost" data-act="sheetclose">' + T("取消","Cancel") + "</button>";
  } else if(s.type === "mic"){
    h = '<p class="t2" style="text-align:center">' + T("正在听……","Listening…") + '</p><p class="s" style="text-align:center">' + T("请说出电话里对方说了什么","Tell me what the caller said") + '</p><div class="wave"><i></i><i></i><i></i><i></i><i></i></div><button class="btn pri" data-act="micdone">' + T("说完了","I'm done") + '</button><button class="btn ghost" data-act="sheetclose">' + T("取消","Cancel") + "</button>";
  } else if(s.type === "reset"){
    h = '<p class="t2">' + T("重新开始测试？","Restart the test?") + '</p><p class="b">' + T("会清除这台手机上的检查记录和测试记录。","This clears check history and the test log on this phone.") + '</p><button class="btn danger mt" data-act="resetgo">' + T("清除并重新开始","Clear and restart") + '</button><button class="btn ghost" data-act="sheetclose">' + T("取消","Cancel") + "</button>";
  }
  el.innerHTML = '<div class="scrim" data-act="scrim"><div class="sheet" role="dialog" aria-modal="true"><div class="grab"></div>' + h + "</div></div>";
}

/* ---------------- render & routing ---------------- */
var NAMES = { home:"首页", check:"检查", history:"记录", settings:"设置", pause:"安全暂停", verify:"官方核实", log:"测试记录" };
var STATUS = '<div class="sb"><span>9:41</span><span class="r">' +
  '<svg width="18" height="12" viewBox="0 0 18 12" aria-hidden="true"><rect x="0" y="8" width="3" height="4" rx="1"/><rect x="5" y="5.5" width="3" height="6.5" rx="1"/><rect x="10" y="3" width="3" height="9" rx="1"/><rect x="15" y="0" width="3" height="12" rx="1"/></svg>' +
  '<svg width="16" height="12" viewBox="0 0 16 12" aria-hidden="true"><path d="M8 2.3c2.4 0 4.6.9 6.2 2.4l1.3-1.3A10.4 10.4 0 0 0 8 .5 10.4 10.4 0 0 0 .5 3.4l1.3 1.3A8.6 8.6 0 0 1 8 2.3z"/><path d="M8 5.8c1.4 0 2.7.5 3.6 1.4l1.3-1.3A7 7 0 0 0 8 4a7 7 0 0 0-4.9 1.9l1.3 1.3c.9-.9 2.2-1.4 3.6-1.4z"/><path d="M8 9.6l2.3-2.3A3.3 3.3 0 0 0 8 6.4c-.9 0-1.7.3-2.3.9z"/></svg>' +
  '<svg width="27" height="13" viewBox="0 0 27 13" aria-hidden="true"><rect x=".5" y=".5" width="23" height="12" rx="3.6" fill="none" stroke="currentColor" opacity=".4"/><rect x="2" y="2" width="20" height="9" rx="2.2"/><path d="M25 4.4v4.2c.9-.3 1.5-1.1 1.5-2.1s-.6-1.8-1.5-2.1z" opacity=".45"/></svg>' +
  "</span></div>";
var VIEWS = { pause:vPause, verify:vVerify, quick:vQuick, quickres:vQuickResult, rec:vRecord, log:vLog };
function render(){
  document.documentElement.className = (S.size === 1 ? "sz1" : S.size === 2 ? "sz2" : "") + (FRAME ? " frame" : "");
  document.documentElement.lang = S.lang === "en" ? "en" : "zh-Hans";
  document.title = T("安心护 · 测试版","WiseHalo · test");
  var root = document.getElementById("root");
  if(!S.started){ root.innerHTML = vWelcome(); renderSheet(); return; }
  var top = S.stack[S.stack.length - 1];
  var v = top ? VIEWS[top.name](top) : ({ home:vHome, check:vCheck, history:vHistory, settings:vSettings })[S.tab]();
  var app = '<div class="app' + (v.home ? " home" : "") + '">' + v.bar + '<main class="main">' + v.body + "</main>" + tabs() + "</div>";
  root.innerHTML = FRAME
    ? '<div class="device"><div class="screen' + (v.home ? " home" : "") + '"><div class="island"></div>' + STATUS + app + '<div class="homebar"></div></div></div>'
    : app;
  renderSheet();
}
// In the portfolio demo the prototype lives in an iframe: don't touch the page's browser history.
function go(name, v){ S.stack.push({ name:name, v:v }); if(!DEMO) try{ history.pushState({ d:S.stack.length }, ""); }catch(e){} render(); window.scrollTo(0, 0); }
function back(){ if(!S.stack.length) return; if(DEMO){ popView(); return; } try{ history.back(); }catch(e){ popView(); } }
function popView(){ var t = S.stack.pop(); if(t && t.name === "pause"){ clearInterval(pauseTimer); if(S.pause && S.pause.state === "run") S.pause.state = "idle", S.pause.left = S.pause.total; } render(); window.scrollTo(0, 0); }
window.addEventListener("popstate", function(){ if(S.sheet){ S.sheet = null; renderSheet(); } if(S.stack.length) popView(); });

var toastT = null;
function toast(msg){ var t = document.getElementById("toast"); t.textContent = msg; t.classList.add("show"); clearTimeout(toastT); toastT = setTimeout(function(){ t.classList.remove("show"); }, 2400); }
function setInput(v){ S.input = v.slice(0, 6000); LS.set("input", S.input); }
function syncCheckUI(){
  var c = document.getElementById("cnt"); if(c) c.textContent = S.input.length + " / 6000";
  var g = document.getElementById("go"); if(g) g.disabled = S.checking || !S.input.trim();
  var sm = document.getElementById("samples"); if(sm) sm.classList.toggle("hide", !!S.input);
  var cl = document.getElementById("clr"); if(cl) cl.classList.toggle("hide", !S.input);
}

var A = {
  tab: function(d){ if(S.tab === d.v && !S.stack.length) return; var n = S.stack.length; S.stack = []; S.tab = d.v; log(T("切换到","Tab") + " " + NAMES[d.v]); if(n && !DEMO) try{ history.go(-n); }catch(e){} render(); window.scrollTo(0, 0); },
  back: back,
  push: function(d){
    if(d.v === "pause"){ S.pause = null; }
    if(d.v === "verify"){ S.verify = [false, false, false]; }
    log(T("打开","Open") + " " + NAMES[d.v]); go(d.v);
  },
  guard: function(){ S.guard = !S.guard; LS.set("guard", S.guard); if(!S.guard){ S.lit = null; LS.set("lit", null); } log(S.guard ? T("开启提醒器守护","Reminder on") : T("改为只用手机提醒","Phone only")); render(); },
  quick: function(){ S.quick = []; log(T("打开通话快速自查","Open self-check")); go("quick"); },
  qa: function(d){
    S.quick.push(d.v);
    if(S.quick.length < QUESTIONS.length){ render(); return; }
    var rec = quickResult(S.quick); addRecord(rec);
    S.stack.pop(); S.stack.push({ name:"quickres", v:rec.id }); render(); window.scrollTo(0, 0);
  },
  qback: function(){ S.quick.pop(); render(); },
  qagain: function(){ S.quick = []; S.stack.pop(); S.stack.push({ name:"quick" }); render(); },
  openrec: function(d){ go("rec", d.v); },
  paste: function(){ setInput(TASK_SMS[S.lang]); log(T("粘贴（预置短信）","Paste (preset SMS)")); toast(T("已粘贴","Pasted")); render(); },
  sample: function(d){ var s = SAMPLES.filter(function(x){ return x.id === d.v; })[0]; setInput(T(s.zh[1], s.en[1])); log(T("选择示例","Example") + " " + d.v); render(); },
  clear: function(){ setInput(""); render(); },
  photo: function(){ toast(T("测试版暂时不能选截图，请用“粘贴”","Photos aren't available in the test – use Paste")); log(T("点了截图","Tapped photo")); },
  mic: function(){ log(T("点了说话","Tapped speak")); S.sheet = { type:"mic" }; renderSheet(); },
  micdone: function(){ setInput((S.input ? S.input + "\n" : "") + SPOKEN[S.lang]); S.sheet = null; log(T("说话输入完成","Speech input done")); toast(T("已转成文字，请看一下再点开始检查","Converted to text – check it, then tap Check")); render(); },
  go: function(){
    if(S.checking || !S.input.trim()) return;
    var ta = document.getElementById("ta"); if(ta) ta.blur();
    S.checking = true; S.latestId = null; log(T("点了开始检查","Check started"), S.input.length + T("字","chars")); render();
    setTimeout(function(){
      S.checking = false; var rec = analyze(S.input); addRecord(rec); render();
      var r = document.getElementById("result"); if(r) r.scrollIntoView({ behavior:"smooth", block:"start" });
    }, 1800);
  },
  speak: function(d){ var rec = findRec(d.v); if(rec) speak(rec); },
  pausego: startPause,
  pausestop: function(){ clearInterval(pauseTimer); S.pause.state = "done"; log(T("提前结束暂停","Pause ended early"), S.pause.left + "s"); render(); },
  vstep: function(d){ S.verify[+d.v] = true; log(T("核实第","Verify step") + (+d.v + 1) + T("步",""), ""); if(S.verify.every(Boolean)) log(T("核实完成","Verify done")); render(); },
  gate: function(){ S.lit = null; LS.set("lit", null); log(T("关闭提醒器（主持人熄灯）","Reminder off (moderator)")); toast(T("提醒器已关闭","Reminder turned off")); render(); },
  share: function(d){ log(T("打开问问信任的人","Open ask someone")); S.sheet = { type:"share", v:d.v || S.latestId }; renderSheet(); },
  sendto: function(d){ S.sheet = null; log(T("发给信任的人","Sent to"), d.v); toast(T("已发给" + d.v + "（测试版不会真的发送）","Sent to " + d.v + " (not really sent in the test)")); renderSheet(); },
  sms: function(d){ log(T("打开发短信给家人","Open text family")); S.sheet = { type:"sms", v:d.v }; renderSheet(); },
  smssend: function(){ S.sheet = null; log(T("发送短信","SMS sent")); toast(T("短信已发送（测试版不会真的发送）","Message sent (not really sent in the test)")); renderSheet(); },
  call: function(){ log(T("点了拨打 96110","Tapped 96110")); toast("测试版不会真的拨打电话"); },
  sheetclose: function(){ S.sheet = null; renderSheet(); },
  scrim: function(d, e){ if(e.target.classList.contains("scrim")){ S.sheet = null; renderSheet(); } },
  size: function(d){ S.size = +d.v; LS.set("size", S.size); log(T("文字大小","Text size"), d.v); render(); },
  lang: function(d){ S.lang = d.v; LS.set("lang", S.lang); render(); },
  phonealert: function(){ S.phoneAlert = !S.phoneAlert; LS.set("phoneAlert", S.phoneAlert); render(); },
  reset: function(){ S.sheet = { type:"reset" }; renderSheet(); },
  resetgo: function(){ var lang = S.lang; LS.clear(); location.href = location.pathname + (DEMO ? location.search : (lang === "en" ? "?lang=en" : "")); },
  copylog: function(){
    var txt = document.getElementById("logtxt").textContent;
    var done = function(){ toast(T("已复制，可以粘贴到微信发给研究者","Copied – paste it into a message to the researcher")); };
    if(navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(txt).then(done, function(){ selectLog(); });
    else selectLog();
  },
  pid: function(d){ S.pid = d.v; LS.set("pid", S.pid); render(); },
  start: function(){ if(!S.pid) return; S.started = true; S.t0 = Date.now(); S.log = []; log(T("开始测试","Test started"), S.pid); save(); render(); }
};
function selectLog(){ var el = document.getElementById("logtxt"); var r = document.createRange(); r.selectNodeContents(el); var s = window.getSelection(); s.removeAllRanges(); s.addRange(r); toast(T("已选中，请长按复制","Selected – long-press to copy")); }

document.addEventListener("click", function(e){
  var el = e.target.closest("[data-act]"); if(!el) return;
  var fn = A[el.getAttribute("data-act")]; if(!fn) return;
  if(el.disabled) return;
  fn({ v: el.getAttribute("data-v") }, e);
});
document.addEventListener("input", function(e){
  if(e.target.id === "ta"){ setInput(e.target.value); syncCheckUI(); }
});
document.addEventListener("change", function(e){
  if(e.target.id === "trusted"){ S.trusted = e.target.value.trim(); LS.set("trusted", S.trusted); }
});
// The portfolio page tells embedded demos when its language changes.
window.addEventListener("message", function(e){
  if(e.origin !== location.origin) return;
  var d = e.data || {};
  if(d.type === "wh-lang" && (d.lang === "zh" || d.lang === "en") && d.lang !== S.lang){ S.lang = d.lang; LS.set("lang", S.lang); render(); }
});
render();
})();
</script>
</body>
</html>
